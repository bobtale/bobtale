name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0d0d0d&color_dots=#ebedf0,#fca5a5,#f87171,#dc2626,#991b1b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e50914&color_dots=#161b22,#4a0d0d,#7f1d1d,#b91c1c,#ef4444

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
